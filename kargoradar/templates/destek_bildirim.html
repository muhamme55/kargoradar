<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { width: 80%; margin: 20px auto; border: 1px solid #eee; padding: 20px; border-radius: 10px; }
        .header { background-color: #ffc107; color: black; padding: 10px; text-align: center; border-radius: 5px; }
        .content { margin-top: 20px; }
        .field { font-weight: bold; color: #555; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Yeni Destek Bildirimi</h2>
        </div>
        <div class="content">
            <p><span class="field">Gönderen Ad Soyad:</span> {{ ad }}</p>
            <p><span class="field">E-posta Adresi:</span> {{ email }}</p>
            <p><span class="field">Konu:</span> {{ konu_basligi }}</p>
            <hr>
            <p><span class="field">Mesaj İçeriği:</span></p>
            <p>{{ mesaj_icerigi }}</p>
        </div>
        <div class="footer">
            <p>Bu e-posta KargoRadar Destek Sistemi üzerinden otomatik olarak oluşturulmuştur.</p>
            <p>&copy; 2024 KargoRadar İşletme Çözümleri</p>
        </div>
    </div>
</body>
</html>
